<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MRP Industrial</title>
<style>
:root{--bg:#f6f7f9;--fg:#1d2330;--card:#fff;--bd:#dde1e8;--ac:#1f6feb;--bad:#c62828;--mut:#6b7280}
@media(prefers-color-scheme:dark){:root{--bg:#12151c;--fg:#e6e9ef;--card:#1b1f29;--bd:#2d3342;--ac:#5b9dff;--bad:#ff6b6b;--mut:#9aa3b2}}
*{box-sizing:border-box}
body{margin:0;font:14px system-ui,sans-serif;background:var(--bg);color:var(--fg)}
header{padding:12px 20px;border-bottom:1px solid var(--bd);background:var(--card)}
h1{margin:0;font-size:18px}
main{padding:16px;max-width:900px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:14px;margin-bottom:16px}
h2{font-size:14px;margin:0 0 10px}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{border:1px solid var(--bd);padding:6px 8px;text-align:left}
th{background:var(--bg)}
input{background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:5px;width:90px}
button{background:var(--ac);color:#fff;border:0;border-radius:6px;padding:6px 10px;cursor:pointer;font-weight:600}
.mut{color:var(--mut)}
.err{color:var(--bad);margin-top:6px}
.ok{color:var(--ac);margin-top:6px}
.barra-busqueda {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}

.barra-busqueda input {
  width: min(100%, 320px);
  padding: 8px;
}
</style>
</head>
<body>
<header><h1>MRP Industrial · Artículos</h1></header>
<main>
  <<div class="card">
  <h2>Artículos</h2>

  <div class="barra-busqueda">
    <input
      id="buscar"
      type="search"
      placeholder="Buscar por código o nombre"
      oninput="mostrarArticulos()"
    >
    <button type="button" onclick="cargarArticulos()">
      Actualizar lista
    </button>
  </div>

  <div id="contenido">Cargando...</div>
  <div id="msg"></div>
</div>
<div class="card">
  <h2>Calcular requerimientos (MRP)</h2>

  <p class="mut">
    Calcula los materiales necesarios y las órdenes planificadas.
  </p>

  <div class="barra-busqueda">
    <label for="horizonteMrp">Horizonte (periodos):</label>

    <input
      id="horizonteMrp"
      type="number"
      min="1"
      max="60"
      step="1"
      value="12"
    >

    <button type="button" onclick="ejecutarMrp()">
      Calcular MRP
    </button>
  </div>

  <div id="mrpMsg" aria-live="polite"></div>
  <div id="mrpResultado"></div>
</div>
</main>

<script>
const $ = (id) => document.getElementById(id);

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({
  '&': '&amp;',
  '<': '&lt;',
  '>': '&gt;',
  '"': '&quot;'
}[c]));

let articulosCargados = [];

// Cargar articulos desde el backend
async function cargarArticulos() {
  const cont = $('contenido');
  const msg = $('msg');

  msg.className = '';
  msg.textContent = '';
  cont.textContent = 'Cargando articulos...';

  try {
    const respuesta = await fetch('/api/articulos');

    if (!respuesta.ok) {
      throw new Error('No se pudieron cargar los articulos.');
    }

    const datos = await respuesta.json();
    articulosCargados = Array.isArray(datos) ? datos : [];

    mostrarArticulos();
  } catch (error) {
    cont.innerHTML = '';
    msg.className = 'err';
    msg.textContent = 'Error al cargar articulos: ' + error.message;
  }
}

// Buscar por codigo o nombre
function mostrarArticulos() {
  const cont = $('contenido');
  const filtro = $('buscar').value.trim().toLowerCase();

  const articulos = articulosCargados.filter((articulo) =>
    String(articulo.codigo || '').toLowerCase().includes(filtro) ||
    String(articulo.nombre || '').toLowerCase().includes(filtro)
  );

  if (articulos.length === 0) {
    cont.innerHTML = articulosCargados.length === 0
      ? '<p class="mut">No hay articulos para mostrar.</p>'
      : '<p class="mut">No se encontraron articulos con esa busqueda.</p>';
    return;
  }

  cont.innerHTML = `
    <div class="tabla-contenedor">
      <table>
        <thead>
          <tr>
            <th>Codigo</th>
            <th>Nombre</th>
            <th>Stock</th>
            <th>Stock seguridad</th>
            <th>Tiempo entrega</th>
            <th>Lote minimo</th>
            <th>Multiplo</th>
            <th>Accion</th>
          </tr>
        </thead>
        <tbody>
          ${articulos.map((a) => `
            <tr>
              <td>${esc(a.codigo)}</td>
              <td>${esc(a.nombre)}</td>
              <td>
                <input
                  class="stock-input"
                  type="number"
                  min="0"
                  step="any"
                  id="stock${Number(a.id)}"
                  value="${esc(a.stock ?? 0)}"
                >
              </td>
              <td>${esc(a.stock_seguridad ?? 0)}</td>
              <td>${esc(a.tiempo_entrega ?? 0)}</td>
              <td>${esc(a.lote_minimo ?? 0)}</td>
              <td>${esc(a.multiplo ?? 1)}</td>
              <td>
                <button onclick="guardarStock(${Number(a.id)})">
                  Guardar
                </button>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
}

// Actualizar el stock de un articulo
async function guardarStock(id) {
  const msg = $('msg');
  const campo = $('stock' + id);
  const texto = campo.value;
  const valor = Number(texto);

  if (texto.trim() === '' || !Number.isFinite(valor) || valor < 0) {
    msg.className = 'err';
    msg.textContent = 'El stock debe ser un numero mayor o igual a cero.';
    return;
  }

  try {
    const respuesta = await fetch(`/api/articulos/${id}/stock`, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ stock: valor })
    });

    const resultado = await respuesta.json();

    if (!respuesta.ok) {
      throw new Error(resultado.mensaje || 'Error al actualizar el stock.');
    }

    const articulo = articulosCargados.find(
      (a) => Number(a.id) === Number(id)
    );

    if (articulo) {
      articulo.stock = valor;
    }

    mostrarArticulos();

    msg.className = 'ok';
    msg.textContent = resultado.mensaje || 'Stock actualizado correctamente.';
  } catch (error) {
    msg.className = 'err';
    msg.textContent = error.message;
  }
}
// Ejecutar el cálculo de requerimientos MRP
async function ejecutarMrp() {
  const campo = $('horizonteMrp');
  const msg = $('mrpMsg');
  const cont = $('mrpResultado');
  const horizonte = Number(campo.value);

  msg.className = '';
  msg.textContent = '';
  cont.innerHTML = '';

  if (!Number.isInteger(horizonte) || horizonte < 1 || horizonte > 60) {
    msg.className = 'err';
    msg.textContent = 'El horizonte debe ser un entero entre 1 y 60.';
    return;
  }

  msg.textContent = 'Calculando materiales...';

  try {
    const respuesta = await fetch('/api/mrp/run', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ horizonte })
    });

    const resultado = await respuesta.json();

    if (!respuesta.ok) {
      throw new Error(
        resultado.mensaje || 'No se pudo realizar el cálculo MRP.'
      );
    }

    const ordenes = Array.isArray(resultado.ordenes)
      ? resultado.ordenes
      : [];

    if (ordenes.length === 0) {
      msg.className = 'ok';
      msg.textContent = 'Cálculo terminado. No se generaron órdenes.';
      cont.innerHTML =
        '<p class="mut">No hay órdenes planificadas para mostrar.</p>';
      return;
    }

    cont.innerHTML = `
      <h3>Órdenes planificadas</h3>
      <p class="mut">
        Horizonte calculado: ${esc(resultado.horizonte)} períodos.
      </p>
      <div class="tabla-contenedor">
        <table>
          <thead>
            <tr>
              <th>Tipo</th>
              <th>Código</th>
              <th>Artículo</th>
              <th>Cantidad</th>
              <th>Nivel</th>
              <th>Lanzamiento</th>
              <th>Recepción</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody>
            ${ordenes.map((orden) => `
              <tr>
                <td>${esc(orden.tipo)}</td>
                <td>${esc(orden.item)}</td>
                <td>${esc(orden.nombre)}</td>
                <td>${esc(orden.qty)}</td>
                <td>${esc(orden.nivel)}</td>
                <td>${esc(orden.lanzar)}</td>
                <td>${esc(orden.recibir)}</td>
                <td>${orden.atrasada ? 'Atrasada' : 'A tiempo'}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;

    msg.className = 'ok';
    msg.textContent =
      'Cálculo realizado. Se muestran las órdenes generadas.';

  } catch (error) {
    msg.className = 'err';
    msg.textContent = 'Error al calcular el MRP: ' + error.message;
  }
}
cargarArticulos();
</script>
</body>
</html>
