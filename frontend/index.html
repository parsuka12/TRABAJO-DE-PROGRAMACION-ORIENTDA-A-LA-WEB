<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MRP Industrial</title>
<style>
:root{--bg:#f6f7f9;--fg:#1d2330;--card:#fff;--bd:#dde1e8;--ac:#1f6feb;--bad:#c62828;--mut:#6b7280}
@media(prefers-color-scheme:dark){:root{--bg:#12151c;--fg:#e6e9ef;--card:#1b1f29;--bd:#2d3342;--ac:#5b9dff;--bad:#ff6b6b;--mut:#9aa3b2}}
*{box-sizing:border-box}
body{margin:0;font:14px system-ui,sans-serif;background:var(--bg);color:var(--fg)}
header{padding:12px 20px;border-bottom:1px solid var(--bd);background:var(--card)}
h1{margin:0;font-size:18px}
main{padding:16px;max-width:900px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:14px;margin-bottom:16px}
h2{font-size:14px;margin:0 0 10px}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{border:1px solid var(--bd);padding:6px 8px;text-align:left}
th{background:var(--bg)}
input{background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:5px;width:90px}
button{background:var(--ac);color:#fff;border:0;border-radius:6px;padding:6px 10px;cursor:pointer;font-weight:600}
.mut{color:var(--mut)}
.err{color:var(--bad);margin-top:6px}
.ok{color:var(--ac);margin-top:6px}
</style>
</head>
<body>
<header><h1>MRP Industrial · Artículos</h1></header>
<main>
  <div class="card">
    <h2>Artículos</h2>
    <div id="contenido">Cargando...</div>
    <div id="msg"></div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function cargarArticulos() {
  const cont = $('contenido');
  const msg = $('msg');
  msg.textContent = '';
  try {
    const r = await fetch('/api/articulos');
    const articulos = await r.json();

    if (!Array.isArray(articulos) || articulos.length === 0) {
      cont.innerHTML = '<p class="mut">No hay artículos para mostrar.</p>';
      return;
    }

    cont.innerHTML = `<table>
      <tr><th>Código</th><th>Nombre</th><th>Stock</th><th>Stock seguridad</th><th>Tiempo entrega</th><th>Lote mínimo</th><th>Múltiplo</th><th></th></tr>
      ${articulos.map((a) => `
        <tr>
          <td>${esc(a.codigo)}</td>
          <td>${esc(a.nombre)}</td>
          <td><input type="number" min="0" id="stock${a.id}" value="${a.stock}"></td>
          <td>${a.stock_seguridad}</td>
          <td>${a.tiempo_entrega}</td>
          <td>${a.lote_minimo}</td>
          <td>${a.multiplo}</td>
          <td><button onclick="guardarStock(${a.id})">Guardar</button></td>
        </tr>`).join('')}
    </table>`;
  } catch (e) {
    cont.innerHTML = '';
    msg.className = 'err';
    msg.textContent = 'No se pudo conectar con el servidor: ' + e.message;
  }
}

async function guardarStock(id) {
  const msg = $('msg');
  const valor = Number($('stock' + id).value);

  if (!Number.isFinite(valor) || valor < 0) {
    msg.className = 'err';
    msg.textContent = 'El stock debe ser un número mayor o igual a cero.';
    return;
  }

  try {
    const r = await fetch(`/api/articulos/${id}/stock`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ stock: valor })
    });
    const j = await r.json();

    if (!r.ok) throw new Error(j.mensaje || 'Error al actualizar el stock');

    msg.className = 'ok';
    msg.textContent = j.mensaje || 'Stock actualizado correctamente';
  } catch (e) {
    msg.className = 'err';
    msg.textContent = e.message;
  }
}

cargarArticulos();
</script>
</body>
</html>
